name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Минимальные права: workflow только читает код.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Проверяет, что gradle-wrapper.jar не подменён.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      # Release собирается всегда, чтобы поломка R8 всплывала на пуше, а не в день выпуска.
      # С секретами (push в репозиторий) APK подписывается релизным ключом;
      # без них (PR от Dependabot и форков) — только проверочная неподписанная сборка.
      - name: Tests, lint, debug and release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.VASULYATOR_KEYSTORE_BASE64 }}
          VASULYATOR_KEYSTORE_PASSWORD: ${{ secrets.VASULYATOR_KEYSTORE_PASSWORD }}
          VASULYATOR_KEY_ALIAS: ${{ secrets.VASULYATOR_KEY_ALIAS }}
          VASULYATOR_KEY_PASSWORD: ${{ secrets.VASULYATOR_KEY_PASSWORD }}
        run: |
          tasks="testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease"
          if [ -n "$KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            VASULYATOR_KEYSTORE_FILE="$keystore" ./gradlew $tasks
            rm -f "$keystore"
          else
            echo "::notice::Signing secrets are not available — release APK is built unsigned, for verification only."
            ./gradlew $tasks -PallowUnsignedRelease=true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vasulyator-apk
          path: app/build/outputs/apk/*/vasulyator-*.apk
          retention-days: 14
